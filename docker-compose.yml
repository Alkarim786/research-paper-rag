# docker compose up --build        -> API on http://localhost:8000/docs
# Index and model downloads persist in named volumes.
services:
  api:
    build: .
    image: research-paper-rag:local
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    volumes:
      - paperrag-data:/data
      - paperrag-models:/models

volumes:
  paperrag-data:
  paperrag-models:
