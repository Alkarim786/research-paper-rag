[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paperrag"
version = "0.1.0"
description = "Hybrid-search RAG over research papers with verified citations and an evaluation harness"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Karim (Alkarim786)" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "pypdf>=4.0",
  "httpx>=0.27",
  "pyarrow>=15",
]

[project.optional-dependencies]
# Real embedding / cross-encoder models (pulls in PyTorch).
ml = ["sentence-transformers>=3.0"]
# Optional abstractive answers with Claude.
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["paperrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM905"]
